name: Generate Milestone 2 Lockfile

on:
  push:
    branches:
      - phase-0/milestone-2-registration-authorization
    paths:
      - .github/workflows/generate-m2-lockfile.yml

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3.8'
          bundler-cache: false

      - name: Update lockfile
        run: bundle lock

      - name: Commit lockfile
        run: |
          if git diff --quiet Gemfile.lock; then
            echo "Gemfile.lock already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Gemfile.lock
          git commit -m "chore: update lockfile for Milestone 2"
          git push
